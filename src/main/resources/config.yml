storage:
  type: YAML # YAML или SQLITE
  sqlite-file: des_data.db

descoin:
  starting-balance: 0
  transfer-tax: 0.0
  messages:
    prefix: "&6[DES]&r "
    only-players: "&cЭту команду может использовать только игрок."
    no-permission: "&cУ вас нет прав."
    invalid-number: "&cВведите корректное число."
    player-not-found: "&cИгрок не найден."
    gave: "&aВы выдали {amount} DESCoin игроку {target}."
    received: "&aВы получили {amount} DESCoin от администратора."
    balance-self: "&eВаш баланс: &6{amount} DESCoin"
    balance-other: "&eБаланс игрока {target}: &6{amount} DESCoin"
    pay-success-sender: "&aВы перевели {amount} DESCoin игроку {target}."
    pay-success-target: "&aИгрок {sender} перевёл вам {amount} DESCoin."
    pay-not-enough: "&cНедостаточно DESCoin."

npc-builder:
  enabled: true
  spawn-world: world
  spawn-x: 0
  spawn-y: 100
  spawn-z: 0
  interaction-radius: 6
  names:
    - "Равшан"
    - "Джамшут"
  command-phrases:
    - "равшан, давай строим"
    - "джамшут, приступай"
    - "начальник сказал строить"
    - "пацаны, строим"
  comments:
    - "{name}: Начальника, щас сделаем красиво, как в Москве!"
    - "{name}: Ой-ой, блоков много, DESCoin давай побольше!"
    - "{name}: Слышь, начальника, не мешай, мы профессионалы!"
    - "{name}: Ща так построим, что деревня офигеет!"
    - "{name}: Эээ, без мата не строится, но мы культурно стараемся!"
  sounds:
    start: BLOCK_ANVIL_USE
    complete: UI_TOAST_CHALLENGE_COMPLETE
    error: ENTITY_PUFFER_FISH_BLOW_OUT
    coin: ENTITY_EXPERIENCE_ORB_PICKUP
  growth:
    base-descoin: 25.0
    block-cost-factor: 0.11
    complexity-factor: 0.85
    base-exp: 5
    exp-block-factor: 0.03
  default-zone:
    size-x: 16
    size-y: 16
    size-z: 16
  schematics:
    hut:
      display-name: "Маленькая хата"
      type: schematic
      block-count: 450
      complexity: 1.2
      resources:
        COBBLESTONE: 300
        OAK_PLANKS: 100
        GLASS: 50
    warehouse:
      display-name: "Склад DE Squad"
      type: litematic
      block-count: 1800
      complexity: 2.0
      resources:
        STONE_BRICKS: 900
        SPRUCE_PLANKS: 500
        GLASS: 300
        LANTERN: 24

quests:
  max-per-day: 3
  reset-hour: 0
  rewards:
    easy: 40
    medium: 90
    hard: 180
  pool:
    easy:
      - "Сломай 32 камня"
      - "Собери 24 дубовых брёвен"
      - "Поймай 6 рыб"
    medium:
      - "Убей 12 зомби"
      - "Добудь 16 железной руды"
      - "Приготовь 20 стейков"
    hard:
      - "Победи 2 эндерменов"
      - "Добудь 24 золота"
      - "Посети Незер и вернись"

market:
  fee-percent: 2.5
  max-listings-per-player: 20
  history-size: 100
  gui-size: 54

npc-craft:
  enabled: true
  one-time-per-player: true
  recipe:
    NETHER_STAR: 2
    BEACON: 1
    NETHERITE_INGOT: 8
    TOTEM_OF_UNDYING: 2
    ENCHANTED_GOLDEN_APPLE: 3

messages:
  gui-title-main: "&8NPC-Строитель"
