name: HybridConverter
version: '${project.version}'
main: dev.sanguine.engine.HybridConverterPlugin
api-version: '1.21'
author: Hazer_2_0
description: Local AI converter for datapacks and resourcepacks 1.20.4 -> 1.21.8.
commands:
  convertpack:
    description: Convert all datapacks/resourcepacks from input to generated folders.
    usage: /convertpack
    permission: hybridconverter.convert
permissions:
  hybridconverter.convert:
    default: op
