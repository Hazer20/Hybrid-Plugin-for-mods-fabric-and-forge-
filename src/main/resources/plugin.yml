name: BookImage
version: 1.0.0
main: com.hazer.bookimage.BookImagePlugin
api-version: '1.21'
author: Hazer_2_0
description: Вставка изображений по URL в книги Minecraft.
commands:
  bookimage:
    description: Конвертировать URL в книге в визуальное изображение.
    usage: /bookimage
    permission: bookimage.use
permissions:
  bookimage.use:
    default: true
