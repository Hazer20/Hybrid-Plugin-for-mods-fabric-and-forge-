plugins { id 'eclipse'; id 'idea'; id 'maven-publish'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = 'com.example.cinematicscenes'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1'; runs { client { workingDirectory project.file('run'); mods { cinematicscenes { source sourceSets.main } } }; server { workingDirectory project.file('run'); mods { cinematicscenes { source sourceSets.main } } } } }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes(['Specification-Title': 'CinematicScenes', 'Specification-Vendor': 'CinematicScenes', 'Implementation-Title': project.name, 'Implementation-Version': project.version]) } }
